services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: kayak-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kayak-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test:
        ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: kayak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kayak
      MYSQL_USER: kayak
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../db/mysql/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: kayak-mongodb
    environment:
      MONGO_INITDB_DATABASE: kayak
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ../db/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kayak-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database seeding service - runs once on startup to populate MySQL
  seed-service:
    build:
      context: ../../ai-recommendation
      dockerfile: Dockerfile
    container_name: kayak-seed-service
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: kayak
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: kayak
      CSV_INDEX_DB_NAME: kayak_csv_index
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../../ai-recommendation/scripts:/app/scripts:ro
      - ../../ai-recommendation/data:/app/data:ro
    command: >
      bash -c "
            echo '🌱 Starting database seed service...'
            sleep 5
            echo '📊 Checking if database needs seeding...'
            FLIGHTS_COUNT=\$(python scripts/check_data_import_status.py 2>/dev/null | grep -oP 'Flights: \K[0-9]+' || echo '0')
            if [ \"\$FLIGHTS_COUNT\" = \"0\" ] || [ -z \"\$FLIGHTS_COUNT\" ]; then
              echo '🌱 Database is empty. Starting data seeding...'
              echo '📥 Running: index_all_datasets.py'
              python scripts/index_all_datasets.py 2>&1 | tail -20 || echo 'ℹ️  index_all_datasets.py completed or skipped'
              echo '📥 Running: populate_booking_db_from_csv.py'
              python scripts/populate_booking_db_from_csv.py 2>&1 | tail -20 || echo 'ℹ️  populate_booking_db_from_csv.py completed or skipped'
              echo '📥 Running: populate_all_deals.py'
              python scripts/populate_all_deals.py 2>&1 | tail -20 || echo 'ℹ️  populate_all_deals.py completed or skipped'
              echo '✅ Data seeding completed'
            else
              echo '✓ Database already seeded (Flights: '\$FLIGHTS_COUNT'). Skipping import.'
            fi
            echo '📊 Final data import status:'
            python scripts/check_data_import_status.py 2>/dev/null || echo 'Could not verify data status'
            echo '✅ Seed service exiting successfully'
           "
    restart: "no"

  ai-recommendation-service:
    build:
      context: ../../ai-recommendation
      dockerfile: Dockerfile
    container_name: kayak-ai-recommendation-service
    ports:
      - "8005:8005"
    environment:
      DOCKER_ENV: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306 # Corrected internal port for MySQL
      MYSQL_USER: kayak
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: kayak
      CSV_INDEX_DB_NAME: kayak_csv_index
      USE_AI: "true"
      GROQ_API_KEY: your_groq_api_key
      GROQ_MODEL: llama-3.3-70b-versatile
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RAW_FEEDS: raw_supplier_feeds
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      seed-service:
        condition: service_completed_successfully
    command: >
      bash -c "
            sleep 5
            echo 'Starting AI Recommendation Service...'
            uvicorn app.main:app --host 0.0.0.0 --port 8005
           "

  admin-service:
    build:
      context: ../../
      dockerfile: src/services/admin-service/Dockerfile
    container_name: kayak-admin-service
    ports:
      - "8006:8006"
    environment:
      NODE_ENV: development
      PORT: 8006
      MYSQL_HOST: mysql
      MYSQL_USER: kayak
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: kayak
      JWT_SECRET: your-secret-key
    depends_on:
      mysql:
        condition: service_healthy
      seed-service:
        condition: service_completed_successfully

  analytics-service:
    build:
      context: ../../
      dockerfile: src/services/analytics-service/Dockerfile
    container_name: kayak-analytics-service
    ports:
      - "8004:8004"
    environment:
      NODE_ENV: development
      PORT: 8004
      MYSQL_HOST: mysql
      MYSQL_USER: kayak
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: kayak
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: your-secret-key
      MONGODB_URI: mongodb://mongodb:27017/kayak
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      seed-service:
        condition: service_completed_successfully
    command: sh -c "sleep 50 && npm start"

  booking-billing-service:
    build:
      context: ../../
      dockerfile: src/services/booking-billing-service/Dockerfile
    container_name: kayak-booking-billing-service
    ports:
      - "8003:8003"
    environment:
      NODE_ENV: development
      PORT: 8003
      MYSQL_HOST: mysql
      MYSQL_USER: kayak
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: kayak
      MONGODB_URI: mongodb://mongodb:27017/kayak
      KAFKA_BROKERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      seed-service:
        condition: service_completed_successfully

  listing-service:
    build:
      context: ../../
      dockerfile: src/services/listing-service/Dockerfile
    container_name: kayak-listing-service
    ports:
      - "8002:8002"
    environment:
      NODE_ENV: development
      PORT: 8002
      MONGODB_URI: mongodb://mongodb:27017/kayak
      MYSQL_HOST: mysql
      MYSQL_USER: kayak
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: kayak
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed-service:
        condition: service_completed_successfully

  user-service:
    build:
      context: ../../
      dockerfile: src/services/user-service/Dockerfile
    container_name: kayak-user-service
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: development
      PORT: 8001
      MONGODB_URI: mongodb://mongodb:27017/kayak
      MYSQL_HOST: mysql
      MYSQL_USER: kayak
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: kayak
      JWT_SECRET: your-secret-key
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      seed-service:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: ../../
      dockerfile: src/services/api-gateway/Dockerfile
    container_name: kayak-api-gateway
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      USER_SERVICE_URL: http://user-service:8001
      LISTING_SERVICE_URL: http://listing-service:8002
      BOOKING_BILLING_SERVICE_URL: http://booking-billing-service:8003
      ANALYTICS_SERVICE_URL: http://analytics-service:8004
      AI_SERVICE_URL: http://ai-recommendation-service:8005
      ADMIN_SERVICE_URL: http://admin-service:8006
      JWT_SECRET: your-secret-key # IMPORTANT: Set this in production!
      KAFKA_BROKERS: kafka:29092
    depends_on:
      user-service:
        condition: service_started
      listing-service:
        condition: service_started
      booking-billing-service:
        condition: service_started
      admin-service:
        condition: service_started
      kafka:
        condition: service_started
      analytics-service:
        condition: service_started
      ai-recommendation-service:
        condition: service_started
      seed-service:
        condition: service_completed_successfully
    command: sh -c "sleep 50 && npm start"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: kayak-frontend
    ports:
      - "80:80"
    environment:
      # In the build the app will default to the internal api-gateway hostname.
      # You can override this with VITE_API_URL if needed.
      VITE_API_URL: http://api-gateway:4000
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://frontend:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  mongo_data:
  redis_data:
